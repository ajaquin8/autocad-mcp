name: Idea
description: A tool or behaviour you'd like.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The drafting task
      description: What you are trying to get done in AutoCAD, in your own words.
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What Claude should be able to do
      placeholder: "Insert a block from my company's library at these points and fill in the attributes."
  - type: input
    id: autocad
    attributes:
      label: AutoCAD version you use
