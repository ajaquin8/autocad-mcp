# Offline checks only: no AutoCAD on the runner. Live tests are run by hand (see CLAUDE.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest   # pywin32 is Windows-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check .
      - name: Offline tests
        run: python -m pytest -q
      - name: Tool reference is up to date
        run: python scripts/gen_tool_docs.py --check
      - name: Vault links
        run: python scripts/check_links.py
      - name: MCP stdio handshake
        run: python scripts/stdio_smoke.py
